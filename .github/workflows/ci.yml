# Continuous integration (D10) — the three-OS build, lint and unit-test matrix.
#
# This workflow has no release trigger and must never acquire one: releases are
# manual only and live in release.yml
# (`.taskflow/2026-08-21-local-runner-manager/09-release-distribution.md`).
#
# ----------------------------------------------------------------------------
# `workflow_call` IS NOT A RELEASE TRIGGER, AND IS NOT AN EXCEPTION TO THE LINE
# ABOVE.
# ----------------------------------------------------------------------------
# release.yml's step 3 has to run "the same matrix as CI, on the release
# commit". The alternative to calling this file is copying the matrix into
# release.yml, and a copied gate is a gate that drifts: the release would go on
# passing the checks CI used to run.
#
# `workflow_call` adds no event. Nothing in GitHub fires it; it is an entry
# point that another workflow in this repository invokes with `uses:`, and the
# only workflow that does is release.yml, which is itself `workflow_dispatch`
# only. So the whole chain still starts at a human pressing a button, which is
# the property D10 actually requires — and `crates/app/tests/release_workflow.rs`
# asserts that release.yml reaches this file rather than reimplementing it.
#
# It also carries no new authority. A called workflow's permissions are capped
# by the caller's and this file declares `contents: read` regardless, so being
# callable does not let anything here touch the publishing credential.
#
# THE ACCEPTANCE SUITE IS NOT HERE. It lives in e2e.yml, on identical triggers,
# because the shared disposable fixture has to be serialised at WORKFLOW level
# and this file's own `concurrency` block below is incompatible with that in two
# ways: it cancels in-progress runs on pull requests, which would kill an
# acceptance leg mid-scenario, and a job-level block cannot override a
# workflow-level one. e2e.yml's header sets out the full reasoning.
#
# Nothing in this file serialises anything for the fixture, and nothing in it
# should try to.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  # The release gate's entry point. See the header: an entry point, not an
  # event — only release.yml calls it, and only a human dispatch starts that.
  workflow_call:

permissions:
  contents: read

# `github.workflow` resolves to the CALLING workflow's name, so a release run's
# legs land in `ci-Release-<ref>` rather than contending with the pull-request
# run of the same ref. `github.event_name` is likewise the caller's event —
# `workflow_dispatch` — so `cancel-in-progress` evaluates false for a release
# and no release test leg is ever cancelled by a later push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # A failed build should say why, not print a backtrace-less panic.
  RUST_BACKTRACE: 1

jobs:
  check:
    name: check (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One red leg must not hide the state of the other two.
      fail-fast: false
      matrix:
        include:
          # ------------------------------------------------------------------
          # THIS LEG RUNS ON THE MAINTAINER'S OWN WINDOWS MACHINE.
          # ------------------------------------------------------------------
          # `rm-ivanpc-win-x64` is a routing label this product's own agent
          # answers: no runner is registered until a job is queued for it, one
          # is created on demand, and it is removed when the job ends. So this
          # repository's Windows CI is served by the thing this repository
          # builds, which is the most direct test of it there is.
          #
          # Two consequences, stated because they are real and were accepted
          # rather than overlooked:
          #
          # * **The release gate depends on that machine.** `release.yml` calls
          #   this workflow, so a host that is off, or an agent too broken to
          #   register a runner, blocks publishing — including publishing the
          #   fix. The recovery is to point this back at `windows-latest` for
          #   one release.
          # * **A fork's pull request runs here.** GitHub gates a first-time
          #   contributor behind an approval and nothing after that, and this
          #   product's own `set-scale` warning says untrusted pull-request
          #   workflows should not run on a personal host. Approving a fork PR
          #   on this repository is therefore a decision about that machine.
          # ------------------------------------------------------------------
          # TEMPORARILY BACK ON A HOSTED RUNNER. RESTORE AFTER 0.1.11 SHIPS.
          # ------------------------------------------------------------------
          # This leg belongs on `rm-ivanpc-win-x64` -- see the note below, which
          # is still the intent. It is parked here to break a loop the note
          # itself predicted:
          #
          #   the local runner serves this leg using the *installed* agent;
          #   the fix that leg needs is the workspace layout in this branch;
          #   the release that installs it runs this workflow to get out.
          #
          # So the agent could not check out a repository whose path it made too
          # long, and the fix for that could not ship past the check it was
          # breaking. One release on a hosted runner is the way out, exactly as
          # the recovery note said.
          #
          # Restore `os: rm-ivanpc-win-x64` once 0.1.11 is installed on that
          # host. Passing afterwards is the real proof the layout fix works,
          # which is a better test than this branch could have run.
          - name: windows-x86_64
            os: windows-latest
          # macos-latest is Apple Silicon, so the platform the persona actually
          # uses is the platform that is tested. The `uname` assertion below
          # keeps that true if GitHub ever repoints the label.
          - name: macos-arm64
            os: macos-latest
          - name: linux-x86_64
            os: ubuntu-latest
    defaults:
      run:
        # bash exists on all three runner images, so every step below is one
        # script rather than one script per OS.
        shell: bash
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Assert the macOS leg is ARM64
        if: runner.os == 'macOS'
        run: |
          echo "runner.arch=${{ runner.arch }}  uname -m=$(uname -m)"
          test "$(uname -m)" = "arm64"

      - name: Install the toolchain pinned by rust-toolchain.toml
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain
          cargo --version
          rustc --version
          cargo fmt --version
          cargo clippy --version

      - name: Cache the cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Verify that the committed Cargo.lock is current
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo build --workspace
        run: |
          cargo build --workspace --all-features
          bash tests/assert-no-shippable-mutants.sh --scan-only

      - name: cargo clippy --all-targets -- -D warnings
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test --workspace
        run: cargo test --workspace

  # ---------------------------------------------------------------------------
  # The privileged installer smoke tests (d3).
  # ---------------------------------------------------------------------------
  # Separate from `check` because these register a REAL Windows service, start
  # it, kill it, and remove it. They are `#[ignore]`d so that an ordinary
  # `cargo test --workspace` — the step above, and every developer's laptop —
  # never does any of that; this job is the one place that asks for them by
  # name. `crates/platform/tests/privileged_tests_are_wired_into_ci.rs` asserts
  # that this job still exists and still passes `--ignored`, because a gate that
  # can be deleted without anything going red is not a gate.
  #
  # WINDOWS ONLY, AND THAT IS `d3`'s OWN SCOPE NOTE RATHER THAN AN OVERSIGHT:
  # "All three installers are written here, in Wave 2, because gate 3 requires
  # verified boot-start recovery on Windows. macOS and Linux installation and
  # reboot recovery are validated in Wave 3 against this same implementation."
  # The launchd and systemd backends are compiled and their definitions are
  # asserted line by line on all three legs by the unit tests in `service.rs`;
  # what no leg has yet done is run `launchctl bootstrap` or `systemctl enable`
  # for real. Wave 3 adds those two legs here, against the same library API.
  #
  # There is no `continue-on-error` here on purpose. If the runner cannot create
  # a service, the tests fail with the remedy rather than passing quietly: a
  # privileged smoke test that skipped when it could not get privileges would
  # report success for having verified nothing.
  service-install:
    name: privileged installer smoke tests (windows-x86_64)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install the toolchain pinned by rust-toolchain.toml
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain

      - name: Cache the cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      # THIS STEP IS LOAD-BEARING AND ITS ABSENCE IS NOT OBVIOUS.
      #
      # The restart measurement needs something the service manager can start,
      # kill, and start again, and that something is `examples/`. A plain
      # `cargo test` builds every example — which is why this was missed
      # locally — but `cargo test --test <name>` selects ONE target and builds
      # no examples at all. `--examples` does not help either: it builds the
      # example as a libtest harness under a hashed name, which is a different
      # binary that would run libtest and exit rather than report itself to the
      # Service Control Manager.
      #
      # So the example is built by name, here, before the tests run.
      # `privileged_tests_are_wired_into_ci.rs` asserts this step still exists.
      - name: Build the fixture service host the restart measurement starts
        run: |
          cargo build -p runner-manager-platform --example service_host_fixture
          cargo build -p runner-manager

      # `--test-threads=1` because these contend for one machine's service
      # database, and because the restart measurement times an interval that a
      # loaded machine would stretch.
      - name: cargo test --test privileged_service_installer -- --ignored
        run: |
          cargo test -p runner-manager-platform \
            --test privileged_service_installer -- --ignored --test-threads=1 --nocapture

      # A leaked privileged service is the worst outcome available to this job,
      # so the claim that nothing leaks is checked rather than trusted — and it
      # is checked even when the step above failed, which is exactly when a
      # fixture would have been left behind.
      - name: Assert no self-test fixture was left on the runner
        if: always()
        shell: pwsh
        run: |
          $services = Get-Service -Name '*selftest*' -ErrorAction SilentlyContinue
          $tasks = & schtasks.exe /Query /FO CSV /NH 2>$null |
            Select-String 'runner-manager-selftest'
          if ($services -or $tasks) {
            Write-Error "a self-test fixture survived: $($services.Name) $tasks"
            exit 1
          }
          Write-Output 'no self-test fixture remains'

