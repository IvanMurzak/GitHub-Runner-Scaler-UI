name: Windows Hyper-V native acceptance
run-name: windows-hyperv-${{ inputs.acceptance_id }}

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: Unique label created by the elevated native acceptance harness
        required: true
        type: string
      acceptance_id:
        description: Non-secret correlation identifier
        required: true
        type: string
      hold_seconds:
        description: Seconds to keep the provider container observable by the host harness
        required: true
        default: '180'
        type: string

permissions:
  contents: read

concurrency:
  group: windows-hyperv-${{ inputs.runner_label }}
  cancel-in-progress: false

jobs:
  production-provider:
    runs-on: [self-hosted, windows, x64, "${{ inputs.runner_label }}"]
    timeout-minutes: 20
    steps:
      - name: Attest the nested runner Job Object
        shell: powershell
        env:
          ACCEPTANCE_ID: ${{ inputs.acceptance_id }}
          HOLD_SECONDS: ${{ inputs.hold_seconds }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:ACCEPTANCE_ID -notmatch '^[0-9]{14}-[0-9a-f]{8}$') {
            throw 'invalid non-secret acceptance id'
          }
          $hold = 0
          if (-not [int]::TryParse($env:HOLD_SECONDS, [ref]$hold) -or $hold -lt 60 -or $hold -gt 900) {
            throw 'hold_seconds must be from 60 through 900'
          }
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class RunnerJobProbe {
              [StructLayout(LayoutKind.Sequential)] public struct IO_COUNTERS {
                  public UInt64 ReadOperationCount, WriteOperationCount, OtherOperationCount;
                  public UInt64 ReadTransferCount, WriteTransferCount, OtherTransferCount;
              }
              [StructLayout(LayoutKind.Sequential)] public struct BASIC_LIMIT_INFORMATION {
                  public Int64 PerProcessUserTimeLimit, PerJobUserTimeLimit;
                  public UInt32 LimitFlags;
                  public UIntPtr MinimumWorkingSetSize, MaximumWorkingSetSize;
                  public UInt32 ActiveProcessLimit;
                  public UIntPtr Affinity;
                  public UInt32 PriorityClass, SchedulingClass;
              }
              [StructLayout(LayoutKind.Sequential)] public struct EXTENDED_LIMIT_INFORMATION {
                  public BASIC_LIMIT_INFORMATION BasicLimitInformation;
                  public IO_COUNTERS IoInfo;
                  public UIntPtr ProcessMemoryLimit, JobMemoryLimit, PeakProcessMemoryUsed, PeakJobMemoryUsed;
              }
              [DllImport("kernel32.dll", SetLastError=true)]
              public static extern bool IsProcessInJob(IntPtr process, IntPtr job, out bool result);
              [DllImport("kernel32.dll", SetLastError=true)]
              public static extern bool QueryInformationJobObject(IntPtr job, int infoClass, out EXTENDED_LIMIT_INFORMATION info, uint length, IntPtr returnedLength);
              [DllImport("kernel32.dll")] public static extern IntPtr GetCurrentProcess();
          }
          '@
          $inJob = $false
          if (-not [RunnerJobProbe]::IsProcessInJob([RunnerJobProbe]::GetCurrentProcess(), [IntPtr]::Zero, [ref]$inJob) -or -not $inJob) {
            throw 'workflow process is not in a Job Object'
          }
          $limits = New-Object RunnerJobProbe+EXTENDED_LIMIT_INFORMATION
          $size = [Runtime.InteropServices.Marshal]::SizeOf($limits)
          if (-not [RunnerJobProbe]::QueryInformationJobObject([IntPtr]::Zero, 9, [ref]$limits, $size, [IntPtr]::Zero)) {
            throw "QueryInformationJobObject failed: $([Runtime.InteropServices.Marshal]::GetLastWin32Error())"
          }
          $flags = $limits.BasicLimitInformation.LimitFlags
          if ($limits.BasicLimitInformation.ActiveProcessLimit -ne 256 -or ($flags -band 0x8) -eq 0 -or ($flags -band 0x2000) -eq 0) {
            throw "unexpected Job Object limits: active=$($limits.BasicLimitInformation.ActiveProcessLimit), flags=$flags"
          }
          if ($env:ACTIONS_RUNNER_INPUT_JITCONFIG) { throw 'JIT configuration survived into the workflow environment' }
          Write-Output "RM_ACCEPTANCE job_object=in_job active_process_limit=256 active_process_flag=true kill_on_close=true id=$env:ACCEPTANCE_ID"
          Start-Sleep -Seconds $hold
          Write-Output "RM_ACCEPTANCE completed id=$env:ACCEPTANCE_ID"
