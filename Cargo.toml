# Virtual workspace manifest for `runner-manager`.
#
# `crates/` sits at the repository root; there is no nested product directory
# (`.taskflow/2026-08-21-local-runner-manager/02-target-architecture.md`,
# "Workspace shape").
#
# ----------------------------------------------------------------------------
# ADDING A NEW EXTERNAL CRATE IS AN A-GROUP CHANGE.
# ----------------------------------------------------------------------------
# Task `a1` owns every `Cargo.toml` in this workspace and the whole
# `[workspace.dependencies]` table below. Every member manifest consumes an
# entry from it with `workspace = true` and never states a version of its own.
#
# The reason is mechanical, not stylistic: 22 later tasks run in parallel
# against this tree. A task that edits a manifest also rewrites `Cargo.lock`,
# and `Cargo.lock` is a single file that every one of them would then collide
# on. So the member manifests below already list dependencies their crate does
# not use yet, precisely so that no later task has to add one.
#
# If a task genuinely needs an external crate that is not listed here, that is
# an A-group change: it is made in this file, by an A-group task, and not in a
# member manifest.
#
# Versions are exact `major.minor.patch` selections; `Cargo.lock` is committed
# and is what actually pins the resolved graph
# (`02-target-architecture.md`: "Exact dependency versions are selected in
# implementation, pinned with `Cargo.lock` and `rust-toolchain.toml`").

[workspace]
resolver = "3"
members = [
    "crates/agent",
    "crates/app",
    "crates/domain",
    "crates/github",
    "crates/platform",
    "crates/testkit",
    "tests",
]

[workspace.package]
version = "0.1.5"
edition = "2024"
rust-version = "1.94.0"
license = "MIT"
authors = ["Ivan Murzak"]
repository = "https://github.com/IvanMurzak/GitHub-Runner-Scaler-UI"
homepage = "https://github.com/IvanMurzak/GitHub-Runner-Scaler-UI"

[workspace.dependencies]

# --- Workspace members ------------------------------------------------------
# Each carries a `version` as well as a `path` so the published `runner-manager`
# crate (D11, `cargo install`) can resolve them from the registry.
runner-manager-agent = { path = "crates/agent", version = "0.1.5" }
runner-manager-domain = { path = "crates/domain", version = "0.1.5" }
runner-manager-github = { path = "crates/github", version = "0.1.5" }
runner-manager-platform = { path = "crates/platform", version = "0.1.5" }
# `testkit` is never published; it is a dev-dependency everywhere and therefore
# carries no `version`, which is what lets `cargo publish` strip it.
runner-manager-testkit = { path = "crates/testkit" }

# --- Async runtime and HTTP -------------------------------------------------
tokio = { version = "1.53.1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
futures = "0.3.34"
async-trait = "0.1.92"
# `rustls` rather than the platform TLS stack: a released Linux binary that
# links the system OpenSSL fails on hosts carrying a different major version,
# and every documented install path here is "download the binary and run it"
# (`09-release-distribution.md`).
#
# `query` gates `RequestBuilder::query()`, which every paginated GitHub call
# needs: `c3` pages the runner inventory and filters in-progress runs, `c4`
# pages queued runs and their jobs. Both are group C, so without this feature
# both tasks would have to edit `crates/github/Cargo.toml`.
#
# `stream` gates `Response::bytes_stream()`. `e2` downloads the GitHub runner
# package — 150-300 MB — and must verify its SHA-256 *before* extraction and
# delete the partial file on mismatch. Without a stream the only option is
# buffering the whole package in RAM on a home host, and there is no partial
# file left on disk to remove.
reqwest = { version = "0.13.4", default-features = false, features = [
    "charset",
    "gzip",
    "http2",
    "json",
    "query",
    "rustls",
    "stream",
    "system-proxy",
] }
url = "2.5.8"

# --- Serialization and configuration ----------------------------------------
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Non-secret local configuration is TOML (`05-infrastructure.md`).
toml = "1.1.4"
base64 = "0.23.1"
hex = "0.4.3"

# --- Persistence ------------------------------------------------------------
# `bundled` compiles SQLite from source, so no CI leg and no user machine needs
# a system SQLite of a particular version.
rusqlite = { version = "0.40.2", features = [
    "bundled",
    "chrono",
    "serde_json",
    "uuid",
] }

# --- Domain value types -----------------------------------------------------
uuid = { version = "1.24.1", features = ["serde", "v4"] }
chrono = { version = "0.4.45", default-features = false, features = [
    "clock",
    "serde",
    "std",
] }

# --- Errors and diagnostics -------------------------------------------------
thiserror = "2.0.20"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [
    "env-filter",
    "json",
    "registry",
] }
# Rotating local agent diagnostics (`05-infrastructure.md`, `logs/`).
tracing-appender = "0.2.5"
# Keeps the user access token and the encoded JIT configuration out of `Debug`
# output by construction rather than by review (`07-security.md`).
secrecy = "0.10.3"

# --- Terminal UI ------------------------------------------------------------
# Ratatui 0.30 keeps Crossterm as its default backend and re-exports it
# (`02-target-architecture.md`). Crossterm is *also* declared directly, at the
# version Ratatui uses, so the `bracketed-paste` and `event-stream` features
# that `g1` requires are unified into Ratatui's own copy. `ratatui::init()`
# alone enables neither (`03-control-flows.md`, flow 6.1).
ratatui = "0.30.2"
crossterm = { version = "0.29.0", features = ["bracketed-paste", "event-stream"] }

# --- Command line -----------------------------------------------------------
clap = { version = "4.6.6", features = ["derive", "env", "wrap_help"] }

# --- Filesystem, packaging, and hashing -------------------------------------
# The runner package is a `.zip` on Windows and a `.tar.gz` elsewhere, and its
# published SHA-256 is verified before extraction (`05-infrastructure.md`).
sha2 = "0.11.0"
flate2 = "1.1.9"
tar = "0.4.46"
zip = "8.6.0"
tempfile = "3.27.0"
directories = "6.0.0"
rand = "0.10.2"

# --- Windows-only platform adapters -----------------------------------------
# DPAPI machine scope for the secret store (`d2`) and the service control
# handler the Windows service host needs (`d3`).
#
# The `windows` crate gates every binding behind a feature module, so a missing
# module is a compile error in the task that needs the call, not a runtime
# surprise. Each one below is here because a named task's Definition of Done
# cannot be met without it:
#
#   Win32_Foundation             `LocalFree`, `HANDLE`, `CloseHandle` — the
#                                types every other module below returns.
#   Win32_Security               parent of the two security modules; also
#                                `SECURITY_ATTRIBUTES` for the restrictive
#                                handles `d1` and `e3` create.
#   Win32_Security_Cryptography  `CryptProtectData`/`CryptUnprotectData`, the
#                                DPAPI machine scope behind `d2`.
#   Win32_Security_Authorization `SetNamedSecurityInfoW`/`GetNamedSecurityInfoW`
#                                — `d2` must ACL the stored token to the service
#                                account so an ordinary local user cannot read
#                                it, and its DoD asserts that per OS, which
#                                means reading the ACL back.
#   Win32_System_Threading       `OpenProcess` + `GetProcessTimes`. `d1` needs a
#                                process identity that survives a restart and
#                                does *not* match a recycled PID; process start
#                                time is the discriminator. `e3`'s
#                                restart-recovery DoD rests on the same
#                                primitive.
#   Win32_Storage_FileSystem     `CreateFileW` taking `SECURITY_ATTRIBUTES`, for
#                                `d1`'s restrictive handoff and `e3`'s
#                                restrictive temporary file.
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }
windows-service = "0.8.1"

# --- macOS-only platform adapters -------------------------------------------
# System Keychain for the machine-scoped secret store (`d2`).
security-framework = "3.7.0"

# --- Unix-only platform adapters --------------------------------------------
# The Unix half of the same process-identity primitive the Windows block above
# describes: `d1` needs a process identity that a recycled PID cannot forge, so
# it pairs the PID with the process start time. Windows reads that through
# `GetProcessTimes`; macOS reads it through `sysctl(KERN_PROC)` and Linux
# through field 22 of `/proc/<pid>/stat`, neither of which `std` exposes.
#
# `libc` rather than `sysinfo`, on three grounds. (1) `sysinfo` would only be
# doing the Unix half anyway — Windows already goes through the `windows` crate
# for `GetProcessTimes` — so it buys one platform path and leaves two sources
# of truth for the same fact. (2) `sysinfo` reports process start time as whole
# seconds since the epoch, which is coarser than a PID-recycling discriminator
# wants, and it refreshes a whole process table to answer a question about one
# PID. (3) `libc` is already in the resolved graph transitively, so declaring
# it adds no package to `Cargo.lock` and nothing new to audit. The cost is the
# two `unsafe` platform paths in `d1`, both short and both testable against the
# calling process itself.
libc = "0.2.189"

# --- Test-only --------------------------------------------------------------
insta = "1.48.0"
wiremock = "0.6.5"
assert_cmd = "2.2.2"
predicates = "3.1.4"
serial_test = "4.0.1"
