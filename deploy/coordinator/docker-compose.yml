# The optional runner-manager coordinator behind Caddy (docs/coordinator.md).
#
#   cd deploy/coordinator
#   echo "COORDINATOR_HOST=runners.example.com" > .env
#   openssl rand -hex 32 > webhook_secret && chmod 600 webhook_secret
#   docker compose up -d --build
#
# Only Caddy publishes ports. The coordinator is reachable from it alone.
#
# The images are the ones each release publishes to GHCR, at the version .env
# names as COORDINATOR_VERSION (`latest` when unset). `docker compose up -d
# --build` builds them from this checkout instead; update.sh and its systemd
# timer keep a deployment on the newest release (docs/coordinator.md, Updates).
#
# The reconciliation sweep (a GitHub App id and private key) is added with a
# docker-compose.override.yml; see docs/coordinator.md.

name: runner-manager-coordinator

services:
  coordinator:
    build:
      context: ../..
      dockerfile: deploy/coordinator/Dockerfile
    image: ghcr.io/ivanmurzak/runner-manager-coordinator:${COORDINATOR_VERSION:-latest}
    restart: unless-stopped
    environment:
      COORDINATOR_PUBLIC_URL: https://${COORDINATOR_HOST:?set COORDINATOR_HOST in .env}
      # Caddy is the only client, and it appends the real client address.
      COORDINATOR_TRUST_FORWARDED_FOR: "true"
      COORDINATOR_WEBHOOK_SECRET_FILE: /run/secrets/webhook_secret
      # The web dashboard: off while the client id is empty. Its client
      # secret comes from docker-compose.override.yml (docs/coordinator.md).
      COORDINATOR_DASHBOARD_CLIENT_ID: ${COORDINATOR_DASHBOARD_CLIENT_ID:-}
      COORDINATOR_DASHBOARD_USERS: ${COORDINATOR_DASHBOARD_USERS:-}
    secrets:
      - webhook_secret
    volumes:
      - coordinator-data:/data
      # update.sh's status.json, read-only, for the dashboard.
      - ./state:/run/coordinator-update:ro
    expose:
      - "8080"

  # A copy of the database every day, the last 7 kept; docs/coordinator.md says
  # how to restore one and how to keep them off this disk. Not read-only: reading
  # a live WAL database needs its shared-memory file.
  backup:
    build:
      context: ../..
      dockerfile: deploy/coordinator/Dockerfile.backup
    image: ghcr.io/ivanmurzak/runner-manager-coordinator-backup:${COORDINATOR_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      - coordinator
    volumes:
      - coordinator-data:/data
      - coordinator-backups:/backups

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    depends_on:
      - coordinator
    ports:
      - "80:80"
      - "443:443"
    environment:
      COORDINATOR_HOST: ${COORDINATOR_HOST:?set COORDINATOR_HOST in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

secrets:
  webhook_secret:
    file: ./webhook_secret

volumes:
  coordinator-data:
  coordinator-backups:
  caddy-data:
  caddy-config:
