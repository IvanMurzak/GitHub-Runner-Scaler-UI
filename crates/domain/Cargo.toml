# Owned by task a1. Dependencies are added in the root [workspace.dependencies]
# table, never here. See the header of the root Cargo.toml.
#
# `rusqlite` is declared for `b2`, which owns `src/store.rs`. It is deliberately
# unused by `b1`'s modules: the domain's logic must stay testable with no
# network, no filesystem, and no clock (`b1`, Definition of Done).

[package]
name = "runner-manager-domain"
description = "Policy, capacity, and runner-attempt state machines for runner-manager."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
chrono = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
runner-manager-testkit = { workspace = true }
serial_test = { workspace = true }
tempfile = { workspace = true }
# A PLACEHOLDER. It is here only so that no later task has to edit this
# manifest and therefore `Cargo.lock` (see the header of the root Cargo.toml).
# Nothing in this crate uses it today, and no named task is its consumer:
# `e1` owns `crates/agent/src/reconcile.rs`, and `crates/agent` already declares
# `test-util` in its own manifest.
#
# ----------------------------------------------------------------------------
# `b1` MUST NOT REACH FOR THIS.
# ----------------------------------------------------------------------------
# `b1` owns `crates/testkit/src/clock.rs`, and its Definition of Done requires
# recovery and backoff decisions to be tested AGAINST THE FAKE CLOCK —
# `testkit::clock`, not `tokio::time::pause()`. The two are not
# interchangeable here. Pausing tokio's clock would satisfy the words "no real
# time dependency" while contradicting the DoD clause that names the fake
# clock, and it would drag an async runtime into a crate that is deliberately
# synchronous and deterministic: this domain's logic must stay testable with no
# network, no filesystem, no runtime, and no clock.
#
# If you are implementing `b1` and this line made you consider
# `tokio::time::pause()`, the answer is `testkit::clock`.
tokio = { workspace = true, features = ["test-util"] }
