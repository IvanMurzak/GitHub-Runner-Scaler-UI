[package]
name = "runner-manager-coordinator"
description = "Optional coordinator for runner-manager: receives GitHub workflow_job webhooks and wakes authenticated hosts over WebSocket."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
# Deployed as a container image built from this repository, never published.
publish = false

[[bin]]
name = "runner-manager-coordinator"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
rand = { workspace = true }
runner-manager-coordinator-protocol = { workspace = true }
runner-manager-domain = { workspace = true }
rusqlite = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true }
tempfile = { workspace = true }
tokio-tungstenite = { workspace = true }
