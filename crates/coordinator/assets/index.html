<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0b0d" media="(prefers-color-scheme: dark)">
  <meta name="referrer" content="same-origin">
  <title>Runner Manager</title>
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/assets/app.js" defer></script>
</head>
<body>
  <div id="boot" class="boot" aria-hidden="true">
    <img src="/assets/icon.svg" alt="" width="36" height="36">
  </div>

  <main id="login" class="login" hidden>
    <div class="login-card">
      <img class="login-mark" src="/assets/icon.svg" alt="" width="56" height="56">
      <h1>Runner Manager</h1>
      <p class="login-lead">GitHub Actions runners, scaled across your Linux, Windows and macOS machines.</p>
      <p id="login-msg" class="notice" role="alert" hidden></p>
      <a class="btn btn-github" href="/auth/login">
        <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        <span>Sign in with GitHub</span>
      </a>
      <p class="login-foot">Access is limited to approved GitHub accounts.</p>
    </div>
  </main>

  <div id="app" class="app" hidden>
    <a class="skip" href="#main">Skip to content</a>
    <header class="topbar">
      <div class="topbar-in">
        <a class="brand" href="/" aria-label="Runner Manager home">
          <img src="/assets/icon.svg" alt="" width="26" height="26">
          <span class="brand-name">Runner Manager</span>
        </a>
        <span id="version" class="version num"></span>
        <span id="update-chip" class="update-chip" hidden></span>
        <span class="spacer"></span>
        <span id="live" class="live"><i aria-hidden="true"></i><span id="live-text">Connecting</span></span>
        <span id="who" class="who"></span>
        <button id="signout" class="icon-btn" type="button" aria-label="Sign out" title="Sign out">
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M8 4H5.5A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8M12.5 6.5 16 10l-3.5 3.5M16 10H8"/></svg>
        </button>
      </div>
    </header>

    <main id="main" class="main" tabindex="-1">
      <div id="banner" hidden></div>

      <section id="kpis" class="kpis" aria-label="Summary"></section>

      <section class="section" aria-labelledby="h-machines">
        <div class="section-head">
          <h2 id="h-machines">Machines</h2>
          <span id="machines-count" class="section-meta"></span>
        </div>
        <div id="hosts" class="hosts"></div>
      </section>

      <div class="split">
        <section class="section card" aria-labelledby="h-queue">
          <div class="section-head">
            <h2 id="h-queue">Queue</h2>
            <span id="queue-count" class="count num"></span>
          </div>
          <div id="queue"></div>
        </section>
        <section class="section card" aria-labelledby="h-running">
          <div class="section-head">
            <h2 id="h-running">Running</h2>
            <span id="running-count" class="count num"></span>
          </div>
          <div id="running"></div>
        </section>
      </div>

      <section id="charts" class="section" aria-labelledby="h-charts">
        <div class="section-head">
          <div>
            <h2 id="h-charts">Activity</h2>
            <p id="charts-sub" class="section-meta"></p>
          </div>
          <div id="range" class="seg" role="group" aria-label="Time range"></div>
        </div>
        <div class="charts">
          <figure id="chart-jobs" class="chart card">
            <figcaption><h3>Jobs</h3><p>Queued vs running</p></figcaption>
            <ul class="legend"></ul>
            <div class="plot"></div>
          </figure>
          <figure id="chart-cpu" class="chart card">
            <figcaption><h3>CPU</h3><p>Load per machine</p></figcaption>
            <ul class="legend"></ul>
            <div class="plot"></div>
          </figure>
          <figure id="chart-busy" class="chart card">
            <figcaption><h3>Busy slots</h3><p>Stacked per machine</p></figcaption>
            <ul class="legend"></ul>
            <div class="plot"></div>
          </figure>
          <figure id="chart-ram" class="chart card">
            <figcaption><h3>Memory</h3><p>Used per machine</p></figcaption>
            <ul class="legend"></ul>
            <div class="plot"></div>
          </figure>
        </div>
      </section>

      <section class="section card" aria-labelledby="h-recent">
        <div class="section-head">
          <h2 id="h-recent">Recent</h2>
          <button id="recent-toggle" class="link-btn" type="button" aria-controls="recent" hidden></button>
        </div>
        <div id="recent"></div>
      </section>

      <section id="pools-section" class="section" aria-labelledby="h-pools" hidden>
        <div class="section-head"><h2 id="h-pools">Pools &amp; leases</h2></div>
        <div id="pools" class="pools"></div>
      </section>
    </main>

    <footer class="foot">
      <span id="uptime"></span>
      <a href="https://github.com/IvanMurzak/GitHub-Runner-Scaler-UI" target="_blank" rel="noopener">runner-manager</a>
    </footer>
  </div>
</body>
</html>
